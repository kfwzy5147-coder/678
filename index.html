<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحب الهدايا - أسرة القديس اغسطينوس 🎁</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .animate-bounce-short {
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="text-white flex items-center justify-center p-4 min-h-screen">

    <div class="max-w-md w-full glass-card rounded-3xl p-6 sm:p-8 text-center relative overflow-hidden">
        
        <!-- Header Section -->
        <div class="mb-6">
            <div id="logo-btn" onclick="handleLogoClick()" class="w-20 h-20 mx-auto bg-indigo-600/30 rounded-full flex items-center justify-center border-2 border-indigo-400/50 mb-3 cursor-pointer select-none transition hover:scale-105 active:scale-95 shadow-lg">
                <span class="text-4xl">⛪</span>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-pink-400 to-indigo-300">
                أسرة القديس اغسطينوس
            </h1>
            <p class="text-slate-300 text-sm mt-1 font-medium">سحب الهدايا المباشر 🎁</p>
        </div>

        <!-- Participant Form -->
        <div id="form-section">
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-right text-xs font-bold text-indigo-200 mb-1">الاسم بالكامل</label>
                    <input type="text" id="user-name" placeholder="اكتب اسمك الثلاثي" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-right text-xs font-bold text-indigo-200 mb-1">رقم الموبايل</label>
                    <input type="tel" id="user-phone" placeholder="01xxxxxxxx" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition text-left" dir="ltr">
                </div>
            </div>

            <button id="submit-btn" onclick="submitParticipation()" class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:from-indigo-600 hover:to-pink-600 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transform transition active:scale-95 text-lg flex items-center justify-center gap-2">
                <span>دخول السحب</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

        <!-- Live Counter Section at the Bottom -->
        <div class="mt-6 pt-4 border-t border-white/10 flex items-center justify-between text-xs text-slate-300 bg-slate-900/40 px-4 py-2.5 rounded-xl">
            <span class="flex items-center gap-1.5 font-semibold">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                إجمالي المشتركين حتى الآن:
            </span>
            <span id="live-public-counter" class="text-base font-extrabold text-amber-300">...</span>
        </div>

        <!-- Developer Credit Tag -->
        <div class="mt-3 text-center text-xs font-bold tracking-widest text-indigo-300/80 drop-shadow-sm dir-ltr">
            اعداد / ⌬"𝙆𝘼𝙍𝙊_𝘾𝙎 ⌬ 💻🔥
        </div>

        <!-- Result View Section -->
        <div id="result-section" class="hidden space-y-4 py-4">
            <div id="result-icon" class="text-6xl mb-2 animate-bounce-short">🎁</div>
            <h2 id="result-title" class="text-2xl font-black">--</h2>
            <div id="result-box" class="p-4 rounded-2xl bg-slate-900/70 border border-slate-700/50 text-slate-200 text-sm leading-relaxed">
                <!-- Result Content -->
            </div>
        </div>

        <!-- Admin Login Modal -->
        <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
            <div class="bg-slate-900 border border-indigo-500/30 rounded-2xl p-6 w-full max-w-sm text-right space-y-4 relative">
                <button onclick="closeAdminModal()" class="absolute top-3 left-3 text-slate-400 hover:text-white text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <h3 class="text-xl font-bold text-amber-300 mb-2">لوحة التحكم الأدمن 🔑</h3>
                
                <div id="admin-login-box" class="space-y-3">
                    <label class="block text-xs font-semibold text-slate-300">كلمة المرور:</label>
                    <input type="password" id="admin-pass" placeholder="****" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-center text-white focus:outline-none focus:border-amber-400">
                    <button onclick="loginAdmin()" class="w-full bg-amber-500 hover:bg-amber-600 font-bold py-2 rounded-lg text-slate-950">دخول</button>
                </div>

                <div id="admin-panel" class="hidden space-y-4 pt-2">
                    <div class="p-3 bg-slate-800 rounded-xl space-y-1">
                        <p class="text-xs text-slate-400">عدد المشتركين كلياً:</p>
                        <p id="counter-display" class="text-3xl font-black text-indigo-400">0</p>
                    </div>

                    <div class="max-h-40 overflow-y-auto bg-slate-800/50 rounded-xl p-2 text-xs space-y-1 text-slate-300" id="participants-list">
                        <!-- Participations list -->
                    </div>

                    <button onclick="resetSystemData()" class="w-full bg-red-600 hover:bg-red-700 font-bold py-2 rounded-lg text-white text-sm">
                        <i class="fa-solid fa-trash-can ml-1"></i> إعادة تصفير السحب
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Local Device Prevention Key
        const LOCAL_STORAGE_USER_RESULT = 'augustine_user_has_entered_v5';
        
        // Highly reliable open counter endpoint
        const UNIQUE_DRAW_KEY = 'st_augustine_church_draw_prize_2026_v8';
        const CLOUD_API_HIT = `https://countapi.mileshilliard.com/api/v1/hit/${UNIQUE_DRAW_KEY}`;
        const CLOUD_API_GET = `https://countapi.mileshilliard.com/api/v1/get/${UNIQUE_DRAW_KEY}`;

        let logoClickCount = 0;
        let logoClickTimer = null;

        function handleLogoClick() {
            logoClickCount++;
            clearTimeout(logoClickTimer);
            if (logoClickCount >= 3) {
                logoClickCount = 0;
                openAdminModal();
            } else {
                logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 1200);
            }
        }

        // Synthesizer Audio Effects
        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.4);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.12);
                        osc.stop(ctx.currentTime + idx * 0.12 + 0.4);
                    });
                } else if (type === 'lose') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.5);
                } else if (type === 'cricket') {
                    for (let i = 0; i < 3; i++) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(4500, ctx.currentTime + i * 0.15);
                        gain.gain.setValueAtTime(0.08, ctx.currentTime + i * 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.08);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + i * 0.15);
                        osc.stop(ctx.currentTime + i * 0.15 + 0.08);
                    }
                }
            } catch(e) {
                console.log('Audio error:', e);
            }
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkExistingUserStatus();
            fetchLivePublicCount();
        });

        async function fetchLivePublicCount() {
            try {
                const res = await fetch(CLOUD_API_GET);
                const data = await res.json();
                const count = data.value || data.count || 0;
                document.getElementById('live-public-counter').innerText = count;
            } catch(e) {
                document.getElementById('live-public-counter').innerText = '0';
            }
        }

        function checkExistingUserStatus() {
            const savedResult = localStorage.getItem(LOCAL_STORAGE_USER_RESULT);
            if (savedResult) {
                const data = JSON.parse(savedResult);
                showAlreadyEnteredScreen(data);
            }
        }

        function showAlreadyEnteredScreen(userResultData) {
            document.getElementById('form-section').classList.add('hidden');
            const resultSection = document.getElementById('result-section');
            resultSection.classList.remove('hidden');

            document.getElementById('result-icon').innerText = '🔒';
            document.getElementById('result-title').innerText = 'كان فيه وخلص!';
            document.getElementById('result-title').className = 'text-2xl font-black text-amber-400';
            
            document.getElementById('result-box').innerHTML = `
                <p class="font-bold text-amber-300 text-base mb-1">تم تسجيل مشاركتك سابقاً</p>
                <p class="text-slate-300">عذراً ${userResultData.name || ''}، غير مسموح بالدخول أكثر من مرة واحدة فقط.</p>
                <hr class="border-slate-700 my-3">
                <p class="text-xs text-slate-400">رقم مشاركتك المسجل: <span class="text-indigo-300 font-bold">#${userResultData.count}</span></p>
            `;
        }

        async function submitParticipation() {
            const nameInput = document.getElementById('user-name').value.trim();
            const phoneInput = document.getElementById('user-phone').value.trim();

            if (!nameInput || nameInput.length < 3) {
                alert('برجاء كتابة الاسم الثلاثي بشكل صحيح');
                return;
            }

            if (!phoneInput || phoneInput.length < 8) {
                alert('برجاء كتابة رقم موبايل صحيح');
                return;
            }

            // Double check local storage
            const saved = localStorage.getItem(LOCAL_STORAGE_USER_RESULT);
            if (saved) {
                showAlreadyEnteredScreen(JSON.parse(saved));
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري تسجيل المشاركة...`;

            let globalCount = 1;

            try {
                // Fetch counter increase from ultra-reliable API
                const res = await fetch(CLOUD_API_HIT);
                const data = await res.json();
                
                if (data && (data.value !== undefined || data.count !== undefined)) {
                    globalCount = parseInt(data.value || data.count);
                } else {
                    throw new Error("Invalid API format");
                }
            } catch (err) {
                console.warn('Network issue or API down, falling back to secondary server:', err);
                try {
                    // Secondary backup endpoint
                    const res2 = await fetch(`https://api.statcounter.com/v1/public/hit?key=${UNIQUE_DRAW_KEY}`);
                    const data2 = await res2.json();
                    globalCount = parseInt(data2.value || 1);
                } catch(e) {
                    let prevLocal = parseInt(localStorage.getItem('fallback_global_count') || '0');
                    globalCount = prevLocal + 1;
                    localStorage.setItem('fallback_global_count', globalCount);
                }
            }

            const participantData = {
                name: nameInput,
                phone: phoneInput,
                count: globalCount,
                date: new Date().toLocaleTimeString('ar-EG')
            };

            // Lock this device permanently
            localStorage.setItem(LOCAL_STORAGE_USER_RESULT, JSON.stringify(participantData));

            // Update bottom counter immediately
            document.getElementById('live-public-counter').innerText = globalCount;

            renderResultUI(globalCount, nameInput);
        }

        function renderResultUI(countNumber, userName) {
            document.getElementById('form-section').classList.add('hidden');
            const resultSection = document.getElementById('result-section');
            resultSection.classList.remove('hidden');

            const iconEl = document.getElementById('result-icon');
            const titleEl = document.getElementById('result-title');
            const boxEl = document.getElementById('result-box');

            if (countNumber < 18) {
                iconEl.innerText = '😔';
                titleEl.innerText = 'خيرها ف غيرها يصاحبي';
                titleEl.className = 'text-2xl font-black text-rose-400';
                
                boxEl.innerHTML = `
                    <p class="text-base font-bold text-rose-300 mb-1">حظ سعيد المرة القادمة!</p>
                    <p class="text-slate-300 text-sm">للأسف الهدية لم تكن من نصيبك هذه المرة. حظ موفق في الفعاليات القادمة مع الأسرة! ✨</p>
                    <div class="mt-3 text-xs bg-slate-950/50 p-2 rounded-lg text-slate-400">رقم مشاركتك: #${countNumber}</div>
                `;
                playSound('lose');

            } else if (countNumber === 18) {
                iconEl.innerText = '🎉';
                titleEl.innerText = 'مبروك كسبت مج حراري 🎁✨';
                titleEl.className = 'text-2xl font-black text-amber-300 animate-pulse';

                boxEl.innerHTML = `
                    <p class="text-lg font-bold text-emerald-400 mb-1">ألف مبروك يا ${userName}! 🥳</p>
                    <p class="text-slate-200 text-sm mb-3">لقد فزت بـ <b>المج الحراري</b> الخاص بسحب أسرة القديس اغسطينوس!</p>
                    <div class="bg-indigo-950/80 border border-indigo-500/50 p-3 rounded-xl text-center">
                        <span class="block text-xs text-indigo-300">كود استلام الهدية:</span>
                        <span class="text-xl font-black text-amber-300 tracking-wider">WIN-18-AUG</span>
                    </div>
                `;
                playSound('win');
                triggerConfetti();

            } else {
                iconEl.innerText = '🖐️';
                titleEl.innerText = 'شطبنا تعال الاجتماع الي بعده';
                titleEl.className = 'text-2xl font-black text-amber-400';

                boxEl.innerHTML = `
                    <p class="text-base font-bold text-amber-300 mb-1">تم تسليم جوائز السحب بالكامل!</p>
                    <p class="text-slate-300 text-sm">شرفتنا بمشاركتك، نتمنى رؤيتك دائماً في جميع الاجتماعات والفعاليات القادمة! ❤️</p>
                    <div class="mt-3 text-xs bg-slate-950/50 p-2 rounded-lg text-slate-400">رقم مشاركتك: #${countNumber}</div>
                `;
                playSound('cricket');
            }
        }

        // Admin Modal Controls
        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function loginAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === '1234') {
                document.getElementById('admin-login-box').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                updateAdminPanel();
            } else {
                alert('كلمة المرور غير صحيحة');
            }
        }

        async function updateAdminPanel() {
            try {
                const res = await fetch(CLOUD_API_GET);
                const data = await res.json();
                document.getElementById('counter-display').innerText = data.value || data.count || 0;
            } catch(e) {
                document.getElementById('counter-display').innerText = 'خطأ في الاتصال';
            }
        }

        function resetSystemData() {
            if (confirm('هل أنت تأكد من تصفير كافة بيانات المشاركين وإعادة السحب للصفر؟')) {
                localStorage.clear();
                alert('تم تصفير البيانات المحلية.');
                location.reload();
            }
        }
    </script>
</body>
</html>
